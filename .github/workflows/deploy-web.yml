name: "Deploy BOOK'D web"

# Builds the Expo web export and publishes it to GitHub Pages.
# URL: https://www.app-bookd.com/
# Runs on pushes to main that touch expo-app/, or manually.

on:
  push:
    branches: [main]
    paths: ['expo-app/**', '.github/workflows/deploy-web.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: expo-app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: expo-app/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npx expo export --platform web
        env:
          EXPO_PUBLIC_SUPABASE_URL: ${{ vars.EXPO_PUBLIC_SUPABASE_URL }}
          EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.EXPO_PUBLIC_SUPABASE_ANON_KEY }}
          # Optional: unset leaves the map on CARTO's keyless basemaps.
          EXPO_PUBLIC_MAP_TILES_DARK: ${{ vars.EXPO_PUBLIC_MAP_TILES_DARK }}
          EXPO_PUBLIC_MAP_TILES_LIGHT: ${{ vars.EXPO_PUBLIC_MAP_TILES_LIGHT }}
          EXPO_PUBLIC_MAP_ATTRIBUTION: ${{ vars.EXPO_PUBLIC_MAP_ATTRIBUTION }}
      # A custom domain serves the site at the ORIGIN root, so app.json sets
      # experiments.baseUrl to "/". The CNAME file keeps the domain attached:
      # Pages reads it from the published artifact, and without it a deploy can
      # clear the custom-domain setting.
      - run: echo 'www.app-bookd.com' > dist/CNAME
      # The head tags a web app needs cannot be written at build time without
      # expo-router, so the export is patched instead. See the script.
      - run: node assets/web/link-manifest.mjs
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: expo-app/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
